[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[project]
name = "pgskewer"
description = "EDWH pgqueuer pipeline (pg-skEWer)"
readme = "README.md"
authors = [
    { name = "Robin van der Noord", email = "robin.vdn@educationwarehouse.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    "anyio",
    "dill",
    "edwh-uuid7",
    "pgqueuer < 0.25",
    "python-dotenv",
    "uvloop",
]
version = "0.4.2"

[project.optional-dependencies]

migrate = [
    "edwh-migrate",
    "pydal",
    "psycopg2-binary",
]

dev = [
    "hatch",
    "edwh",
    "pytest",
    "pytest-cov",
    "pytest-anyio",
    # from migrate:
    "edwh-migrate",
    "pydal",
    "psycopg2-binary",
]


[project.scripts]
pgskewer = "pgskewer.cli:main"


[tool.vommit]
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "beta"
confirm = true

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!--next-version-placeholder-->"
placeholder_regex = "<auto>"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
feat = "Feature{s}"
fix = "Fix{es}"
break = "Breaking Change{s}"
docs = "Documentation"
perf = "Performance"

[tool.vommit.pypi]
enabled = true
use_keyring = true

[tool.vommit.commands]
clean = "rm -rf ./dist"
build = "uv build"
publish = "uv publish"
post_publish = ""

[tool.vommit.version_bump_map]
break = "major"
feat = "minor"
fix = "patch"
perf = "patch"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = []

[tool.isort]
profile = "black"
extend_skip_glob = ["venv*"]
